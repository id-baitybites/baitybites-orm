# Baitybites ORM — Scheduled Database Backup
# Berjalan setiap hari pukul 02:00 WIB (19:00 UTC hari sebelumnya)
#
# Setup:
#   1. Di GitHub repo → Settings → Secrets and variables → Actions
#   2. Tambahkan secret: DATABASE_URL (connection string PostgreSQL Anda)
#
# Backup tersimpan sebagai GitHub Actions Artifact selama 30 hari.

name: Database Backup

on:
  schedule:
    # Setiap hari pukul 02:00 WIB = 19:00 UTC
    - cron: "0 19 * * *"
  workflow_dispatch:
    # Bisa dijalankan manual dari tab Actions di GitHub

jobs:
  backup:
    name: Backup PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DIR: ./backups
          MAX_BACKUPS: "30"
        run: node prisma/backup.js

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}-${{ github.run_attempt }}
          path: backups/*.sql
          retention-days: 30
          if-no-files-found: error

      - name: Backup summary
        run: |
          echo "✅ Backup selesai"
          ls -lh backups/*.sql
